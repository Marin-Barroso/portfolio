name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Corrige les fautes des textes saisis dans /admin et enregistre la correction dans le dépôt
      # (un push fait avec GITHUB_TOKEN ne relance pas ce workflow)
      - name: Correct spelling
        run: node scripts/spellcheck.mjs

      - name: Save spelling fixes
        run: |
          if ! git diff --quiet -- data; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Corrige automatiquement l'orthographe des textes"
            git push
          fi

      # Régénère le PDF à partir des données (modifiées éventuellement depuis /admin)
      - name: Generate PDF
        run: npm run pdf

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /portfolio

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
