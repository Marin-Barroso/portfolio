# Interface d'administration (Sveltia CMS) : chaque enregistrement crée un commit sur main,
# ce qui relance le déploiement GitHub Pages et régénère le PDF.
backend:
  name: github
  repo: Marin-Barroso/portfolio
  branch: main
  commit_messages:
    update: "Admin : met à jour {{path}}"

locale: fr
site_url: https://marin-barroso.github.io/portfolio/
display_url: https://marin-barroso.github.io/portfolio/
media_folder: public/images/missions
public_folder: /images/missions
# Les photos sont converties en WebP et réduites à l'envoi pour garder un site rapide
media_libraries:
  default:
    config:
      max_file_size: 15000000
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1600
          height: 1600

collections:
  - name: missions
    label: Missions
    files:
      - name: missions
        label: Fiches mission
        file: data/missions.json
        fields:
          - name: missions
            label: Missions
            label_singular: mission
            widget: list
            summary: "{{fields.title}} ({{fields.type}}, {{fields.start}})"
            fields:
              - { name: draft, label: "Brouillon", widget: boolean, default: false, hint: "Coché : la mission reste cachée sur le site et dans le PDF. Décoche-le pour la publier." }
              - { name: slug, label: "Identifiant dans l'adresse", hint: "Minuscules et tirets, sans accent (ex. : vidange-clio). Ne pas le changer ensuite, sinon les liens vers la fiche cassent.", pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Minuscules, chiffres et tirets uniquement"] }
              - { name: title, label: Titre, hint: "Court et concret, ex. : « Révision complète sur une Peugeot 106 » (60 caractères max conseillés)." }
              - { name: type, label: Type, widget: select, options: [{ label: "Mission pro (stage, emploi)", value: Pro }, { label: "Mission perso", value: Perso }] }
              - { name: start, label: "Date de début", hint: "Format AAAA-MM, ex. : 2026-04. Sert à trier les missions de la plus récente à la plus ancienne.", pattern: ["^[0-9]{4}-(0[1-9]|1[0-2])$", "Format AAAA-MM, ex. : 2026-04"] }
              - { name: location, label: "Lieu ou entreprise", hint: "Ex. : Speed Motors, Mérignac" }
              - { name: period, label: Période, hint: "Ex. : 13/04 – 25/07/2026" }
              - { name: duration, label: Durée, hint: "Ex. : 10 semaines, 45 min, projet en cours" }
              - { name: year, label: Année, hint: "Affichée sur les cartes, ex. : 2026" }
              - { name: thumbnail, label: "Vignette", widget: image, required: false, hint: "Facultatif. Image affichée en haut de la carte de la mission (accueil et page Missions). Format paysage conseillé." }
              - { name: tags, label: "Mots-clés", widget: list, field: { name: tag, label: "Mot-clé" }, hint: "3 ou 4 mots-clés courts, sans répéter les compétences ci-dessous." }
              - { name: skills, label: "Compétences mobilisées", widget: list, field: { name: skill, label: Compétence }, hint: "Reprends si possible les noms de la rubrique Compétences." }
              - { name: result, label: "Résultat chiffré", required: false, hint: "Facultatif, une phrase avec un chiffre. Ex. : « 12 chantiers planifiés par semaine », « 30 % de temps gagné sur la révision »." }
              - name: details
                label: Détails de la fiche
                widget: object
                fields:
                  - { name: post, label: Poste, hint: "Ex. : Exécutant, Assistant responsable du pôle mécanique" }
                  - { name: mission, label: Mission, hint: "Une phrase : ce qu'on t'a confié." }
                  - { name: means, label: Moyens, hint: "Outils, atelier, encadrement…" }
                  - { name: constraints, label: Contraintes, hint: "Délais, budget, débit, météo…" }
                  - { name: steps, label: Étapes, label_singular: étape, widget: list, fields: [{ name: caption, label: Étape }], hint: "3 à 5 étapes, une phrase courte chacune." }
                  - { name: highlights, label: Faits marquants, widget: text, hint: "2 à 3 phrases : ce qui t'a surpris ou marqué." }
                  - { name: skills, label: "Ce que j'ai appris", widget: text, hint: "2 à 3 phrases : compétences et savoir-être acquis." }
                  - { name: liked, label: "Ce que j'ai aimé", widget: text, hint: "1 à 2 phrases." }
              - name: photos
                label: Photos
                label_singular: photo
                widget: list
                required: false
                summary: "{{fields.caption}}"
                hint: "Les deux premières photos sont reprises dans le PDF."
                fields:
                  - { name: image, label: Photo, widget: image }
                  - { name: caption, label: Légende, required: false }

  - name: competences
    label: Compétences
    files:
      - name: skills
        label: Compétences et langues
        file: data/skills.json
        fields:
          - name: technical
            label: Compétences
            label_singular: compétence
            widget: list
            summary: "{{fields.name}} ({{fields.level}})"
            fields:
              - { name: name, label: Nom }
              - { name: level, label: Niveau, hint: "Ex. : Pratiqué en stage, Pratiqué en études" }
              - { name: category, label: Rubrique, widget: select, options: [{ label: "CAO et conception", value: cao }, { label: Fabrication, value: fabrication }, { label: "Mécanique et électricité", value: mecanique-electricite }, { label: "Langues et savoir-être", value: langues-savoir-etre }] }
              - { name: missions, label: "Missions liées", widget: relation, collection: missions, file: missions, value_field: "missions.*.slug", display_fields: ["missions.*.title"], search_fields: ["missions.*.title"], multiple: true, required: false }
              - { name: experiences, label: "Expériences liées", widget: relation, collection: parcours, file: parcours, value_field: "experiences.*.title", display_fields: ["experiences.*.title"], search_fields: ["experiences.*.title"], multiple: true, required: false }
          - name: languages
            label: Langues
            label_singular: langue
            widget: list
            summary: "{{fields.name}} : {{fields.level}}"
            fields:
              - { name: name, label: Langue }
              - { name: level, label: Niveau, hint: "Natif, A1, A2, B1, B2, C1 ou C2" }

  - name: parcours
    label: Parcours
    files:
      - name: parcours
        label: Formation et expériences
        file: data/parcours.json
        fields:
          - name: education
            label: Formation
            label_singular: diplôme
            widget: list
            summary: "{{fields.year}} · {{fields.title}}"
            fields:
              - { name: year, label: Année }
              - { name: title, label: Diplôme }
              - { name: specialty, label: Spécialité }
              - { name: location, label: Établissement }
          - name: experiences
            label: Expériences
            label_singular: expérience
            widget: list
            summary: "{{fields.year}} · {{fields.title}}"
            fields:
              - { name: year, label: Année }
              - { name: duration, label: Durée }
              - { name: title, label: Poste }
              - { name: company, label: "Entreprise et ville" }
              - { name: description, label: Description, widget: text, required: false }
              - { name: isAutomotive, label: "Expérience en mécanique", widget: boolean, default: false }
              - { name: skills, label: Compétences, widget: list, field: { name: skill, label: Compétence }, required: false }
